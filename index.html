<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="main-menu" class="screen">

        <button id="title-button">
            Geography Quiz
        </button>

        <div id="current-selection">
            World
        </div>

        <div id="buttons"></div>

    </div>

    <div id="fournamesquiz" class="screen">

        <div id="score-fournames">
            Score: 0
        </div>

        <div id="hp-fournames">
            HP: 3
        </div>
        <div id="flag"></div>
        <div id="answerbuttonsnames"></div>
    </div>

    <div id="fourflagsquiz" class="screen">

        <div id="score-fourflags">
            Score: 0
        </div>

        <div id="hp-fourflags">
            HP: 3
        </div>
        <div id="name"></div>
        <div id="answerbuttonsflags"></div>
    </div>

    <div id="deathscreen" class="screen">

        <div id="game-over">Game Over!</div>

        <div id="final-score"></div>

        <button id="back-to-menu" class="menu-button">
            Back to Main Menu
        </button>
"
    </div>

    <script type="module" src="main.js"></script>

</body>
</html>
