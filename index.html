<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="main-menu" class="screen">

        <button id="title-button">
            Geography Quiz
        </button>

        <div id="current-selection">
            World
        </div>

        <div id="buttons"></div>

    </div>

    <div id="image-names" class="screen">

        <div id="score-image-names">
            Score: 0
        </div>

        <div id="hp-image-names">
            HP: 3
        </div>
        <div id="questionsimage-names"></div>
        <div id="answerbuttonsimage-names"></div>
    </div>

    <div id="image-images" class="screen">

        <div id="score-image-images">
            Score: 0
        </div>

        <div id="hp-image-images">
            HP: 3
        </div>
        <div id="questionsimage-images"></div>
        <div id="answerbuttonsimage-images"></div>
    </div>

    <div id="name-names" class="screen">

        <div id="score-name-names">
            Score: 0
        </div>

        <div id="hp-name-names">
            HP: 3
        </div>
        <div id="questionsname-names"></div>
        <div id="answerbuttonsname-names"></div>
    </div>

    <div id="name-images" class="screen">

        <div id="score-name-images">
            Score: 0
        </div>

        <div id="hp-name-images">
            HP: 3
        </div>
        <div id="questionsname-images"></div>
        <div id="answerbuttonsname-images"></div>
    </div>

    <div id="deathscreen" class="screen">

        <div id="game-over">
            Game Over!
        </div>

        <div id="final-score"></div>

        <button id="back-to-menu" class="menu-button">
            Back to Main Menu
        </button>
    </div>

    <script type="module" src="main.js"></script>

</body>
</html>
